<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.R.V.E. Tarapacá | Inicio</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --sirve-green-dark: #1b3832;
            --sirve-green-light: #e8f0ec;
            --sirve-accent: #d95d39;
            --sirve-accent-hover: #b84726;
        }

        body { 
            background-color: #f7f9f8; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: #2d3748; 
        }

        /* Hero Section */
        .hero-section { 
            background: linear-gradient(135deg, #e4ede7 0%, #f4f8f5 100%); 
            min-height: 85vh; 
            padding: 5rem 1.5rem; 
        }
        
        .hero-title { 
            font-size: 3.5rem; 
            font-weight: 800; 
            color: var(--sirve-green-dark); 
            line-height: 1.15; 
        }
        
        .hero-title span { 
            color: var(--sirve-accent); 
            font-style: italic; 
        }

        /* Botones personalizados */
        .btn-sirve-primary { 
            background-color: var(--sirve-green-dark); 
            color: white; 
            font-weight: 600; 
            padding: 0.85rem 1.8rem; 
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 56, 50, 0.15);
        }
        .btn-sirve-primary:hover { 
            background-color: #122622; 
            color: white; 
            transform: translateY(-2px);
        }

        .btn-sirve-accent { 
            background-color: var(--sirve-accent); 
            color: white; 
            font-weight: 600; 
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-sirve-accent:hover { 
            background-color: var(--sirve-accent-hover); 
            color: white; 
        }

        /* Tarjeta Dashboard Preview */
        .card-preview { 
            background: linear-gradient(145deg, #1b3832 0%, #0f2420 100%); 
            color: white; 
            border-radius: 20px; 
            padding: 3rem 2.5rem; 
            box-shadow: 0 15px 35px rgba(27, 56, 50, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Tarjetas de características */
        .feature-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            border: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }
        .feature-icon {
            font-size: 2.2rem;
            color: var(--sirve-accent);
        }
    </style>
</head>
<body>

                <div>
                    <strong class="d-block text-dark leading-none fs-5">S.I.R.V.E.</strong>
                    <small class="text-muted fs-7">Tarapacá</small>
                </div>
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="index.html" class="nav-link text-dark fw-bold active">Inicio</a>
                <a href="#plataforma" class="nav-link text-muted">Plataforma</a>
                <a href="login.html" class="nav-link text-dark fw-bold">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-sirve-accent text-decoration-none"><i class="bi bi-person-plus-fill me-1"></i> Crear cuenta</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section Principal -->
    <section class="hero-section d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <span class="badge bg-
