<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Web - Proyecto Integrador</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TecnologíaWeb</a>
            <div id="userInfo" class="text-white ms-auto d-none">
                <span id="userEmail" class="me-3"></span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Formulario de Autenticación (Login / Registro) -->
        <div id="authContainer" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                    <form id="authForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre (para registro)</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" required placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" required placeholder="******">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="btnLogin" class="btn btn-primary">Ingresar</button>
                            <button type="button" id="btnSignUp" class="btn btn-outline-secondary">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel Protegido (Dashboard) -->
        <div id="appContainer" class="d-none">
            <div class="alert alert-success shadow-sm">
                <h4 class="alert-heading">¡Bienvenido!</h4>
                <p>Has accedido con éxito a la plataforma conectada directamente a Supabase.</p>
            </div>
        </div>
    </div>

    <!-- SDK Oficial de Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuración y Lógica JS -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
